[package]
name = "local-jieba"
description = "jieba-rs (vendored) with a Python-jieba-compatible posseg cut"
edition = "2024"
version.workspace = true
publish.workspace = true
license = "MIT"

[lib]
name = "jieba_rs"

[features]
default = ["default-dict"]
default-dict = ["dep:include-flate"]

[dependencies]
bytecount = { version = "0.6", features = ["runtime-dispatch-simd"] }
include-flate = { version = "0.3.1", optional = true }
jieba-macros = "0.11.0"
rustc-hash = "2.1"

[dev-dependencies]
expect-test = "1.5"
