[package]
name = "local-zh-tts-frontend"
description = "Mandarin TTS front end ported from PaddleSpeech (g2pW + tone sandhi) with WeText TN"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = []
cuda = ["local-backend-ort/cuda"]

[dependencies]
ferrous-opencc = "0.4"
local-jieba = { path = "../jieba" }
local-backend-ort = { path = "../backend-ort" }
local-error = { path = "../error" }
local-wetext = { path = "../wetext" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
