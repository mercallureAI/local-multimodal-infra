[package]
name = "local-wetext"
description = "WeText text normalization (vendored from SpenserCai/wetext-rs)"
edition.workspace = true
version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
name = "wetext"

[dependencies]
anyhow = "1"
once_cell = "1"
regex = "1"
rustfst = "1"
serde_json.workspace = true
thiserror = "2"
unicode-segmentation = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
