[package]
name = "local-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# One feature per model category (see `ModelCategory`); a worker built without
# one does not offer its models.
default = ["asr", "tts", "chat", "embedding", "rerank", "detect", "ocr", "moderation"]
asr = ["dep:local-adapter-sensevoice-asr"]
tts = ["dep:local-adapter-index-tts", "dep:local-adapter-index-tts2", "dep:local-adapter-qwen3-tts"]
chat = ["dep:local-adapter-qwen3-chat"]
embedding = ["dep:local-adapter-e5-embedding"]
rerank = ["dep:local-adapter-mmarco-reranker"]
detect = ["dep:local-adapter-yolo", "dep:local-adapter-depth-anything-v2"]
ocr = ["dep:local-adapter-unlimited-ocr", "dep:local-adapter-ppocrv5-mobile"]
moderation = ["dep:local-adapter-qwen3guard", "dep:local-adapter-nsfw-vit"]
cuda = [
    "local-adapter-e5-embedding?/cuda",
    "local-adapter-index-tts?/cuda",
    "local-adapter-index-tts2?/cuda",
    "local-adapter-qwen3-tts?/cuda",
    "local-adapter-mmarco-reranker?/cuda",
    "local-adapter-qwen3-chat?/cuda",
    "local-adapter-sensevoice-asr?/cuda",
    "local-adapter-unlimited-ocr?/cuda",
    "local-adapter-ppocrv5-mobile?/cuda",
    "local-adapter-yolo?/cuda",
    "local-adapter-depth-anything-v2?/cuda",
    "local-adapter-qwen3guard?/cuda",
    "local-adapter-nsfw-vit?/cuda",
]
directml = [
    "local-adapter-e5-embedding?/directml",
    "local-adapter-index-tts?/directml",
    "local-adapter-index-tts2?/directml",
    "local-adapter-qwen3-tts?/directml",
    "local-adapter-mmarco-reranker?/directml",
    "local-adapter-qwen3-chat?/directml",
    "local-adapter-sensevoice-asr?/directml",
    "local-adapter-unlimited-ocr?/directml",
    "local-adapter-ppocrv5-mobile?/directml",
    "local-adapter-yolo?/directml",
    "local-adapter-depth-anything-v2?/directml",
    "local-adapter-qwen3guard?/directml",
    "local-adapter-nsfw-vit?/directml",
]
tensorrt = [
    "local-adapter-e5-embedding?/tensorrt",
    "local-adapter-index-tts?/tensorrt",
    "local-adapter-index-tts2?/tensorrt",
    "local-adapter-qwen3-tts?/tensorrt",
    "local-adapter-mmarco-reranker?/tensorrt",
    "local-adapter-qwen3-chat?/tensorrt",
    "local-adapter-sensevoice-asr?/tensorrt",
    "local-adapter-unlimited-ocr?/tensorrt",
    "local-adapter-ppocrv5-mobile?/tensorrt",
    "local-adapter-yolo?/tensorrt",
    "local-adapter-depth-anything-v2?/tensorrt",
    "local-adapter-qwen3guard?/tensorrt",
    "local-adapter-nsfw-vit?/tensorrt",
]

[dependencies]
local-adapter-e5-embedding = { workspace = true, optional = true }
local-adapter-index-tts = { workspace = true, optional = true }
local-adapter-index-tts2 = { workspace = true, optional = true }
local-adapter-qwen3-tts = { workspace = true, optional = true }
local-adapter-mmarco-reranker = { workspace = true, optional = true }
local-adapter-qwen3-chat = { workspace = true, optional = true }
local-adapter-sensevoice-asr = { workspace = true, optional = true }
local-adapter-unlimited-ocr = { workspace = true, optional = true }
local-adapter-ppocrv5-mobile = { workspace = true, optional = true }
local-adapter-yolo = { workspace = true, optional = true }
local-adapter-depth-anything-v2 = { workspace = true, optional = true }
local-adapter-qwen3guard = { workspace = true, optional = true }
local-adapter-nsfw-vit = { workspace = true, optional = true }
local-backend-ort.workspace = true
local-core.workspace = true
local-error.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
hound.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
