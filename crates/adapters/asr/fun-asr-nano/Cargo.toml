[features]
default = []
cuda = ["local-backend-ort/cuda", "local-adapter-sensevoice-asr/cuda"]
directml = ["local-backend-ort/directml", "local-adapter-sensevoice-asr/directml"]
tensorrt = ["local-backend-ort/tensorrt", "local-adapter-sensevoice-asr/tensorrt"]

[dependencies]
base64 = "0.22"
half.workspace = true
local-adapter-sensevoice-asr.workspace = true
local-backend-ort.workspace = true
local-core.workspace = true
local-error.workspace = true
