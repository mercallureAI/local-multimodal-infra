[workspace]
resolver = "2"
members = [
    "crates/foundation/*",
    "crates/service/*",
    "crates/api/*",
    "crates/inference/*",
    "crates/text/*",
    "crates/adapters/*/*",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
half = { version = "2.1", default-features = false }
hound = "3.5"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
ndarray = "0.15"
ort = { version = "2.0.0-rc.12", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.16.0", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sysinfo = "0.30"
thiserror = "1"
tokio-tungstenite = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

# Workspace crates
local-core = { path = "crates/foundation/core" }
local-error = { path = "crates/foundation/error" }
local-config = { path = "crates/foundation/config" }
local-telemetry = { path = "crates/foundation/telemetry" }
local-hardware = { path = "crates/foundation/hardware" }
local-files = { path = "crates/foundation/files" }
local-cli = { path = "crates/service/cli" }
local-controller = { path = "crates/service/controller" }
local-worker = { path = "crates/service/worker", default-features = false }
local-scheduler = { path = "crates/service/scheduler" }
local-registry = { path = "crates/service/registry" }
local-model-store = { path = "crates/service/model-store" }
local-api-openai = { path = "crates/api/openai" }
local-api-mcp-infer = { path = "crates/api/mcp-infer" }
local-api-mcp-admin = { path = "crates/api/mcp-admin" }
local-runtime = { path = "crates/inference/runtime", default-features = false }
local-backend-ort = { path = "crates/inference/backend-ort" }
local-voice-cascade = { path = "crates/inference/voice-cascade" }
local-jieba = { path = "crates/text/jieba" }
local-wetext = { path = "crates/text/wetext" }
local-zh-tts-frontend = { path = "crates/text/zh-tts-frontend" }
local-adapter-sensevoice-asr = { path = "crates/adapters/asr/sensevoice" }
local-adapter-index-tts = { path = "crates/adapters/tts/index-tts" }
local-adapter-index-tts2 = { path = "crates/adapters/tts/index-tts2" }
local-adapter-qwen3-chat = { path = "crates/adapters/chat/qwen3" }
local-adapter-e5-embedding = { path = "crates/adapters/embedding/e5" }
local-adapter-mmarco-reranker = { path = "crates/adapters/rerank/mmarco" }
local-adapter-yolo = { path = "crates/adapters/detect/yolo" }
local-adapter-unlimited-ocr = { path = "crates/adapters/ocr/unlimited-ocr" }
local-adapter-silero-vad = { path = "crates/adapters/vad/silero" }
