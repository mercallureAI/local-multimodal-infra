id: qwen3-4b-instruct-2507-int4-onnx
name: Qwen3-4B-Instruct-2507 INT4 ONNX
enabled: true
task_kinds:
  - chat.complete
adapter: qwen3_chat
backend: ort
artifacts:
  # The published package (path omitted: <model_dir>/qwen3-4b-instruct-2507-int4-onnx),
  # built from Qwen/Qwen3-4B-Instruct-2507 at revision
  # cdbee75f17c01a7cc42f958dc650907174af0554 by
  #   python -m onnxruntime_genai.models.builder -i <src> \
  #     -o <dir> -p int4 -e cuda --extra_options int4_algo_config=rtn_last prune_lm_head=true
  # with the graph renamed model_int4.onnx (genai_config.json names it).
  - type: hugging_face
    repo_id: ModaLeap/qwen3-4b-instruct-2507-onnx
    revision: 9edf4d82358af91d00e028f891f8a23ce738d997
    files:
      - model_int4.onnx
      - model_int4.onnx.data
      - genai_config.json
      - tokenizer.json
      - tokenizer_config.json
      - chat_template.jinja
      - manifest.json
      - config.json
      - LICENSE
runtime:
  provider_order: [cuda, cpu]
  max_concurrency: 1
  idle_ttl_sec: 600
resources:
  min_ram_mb: 4096
  min_vram_mb: 4096
load_policy:
  lazy: true
  evictable: true
  pin: false
metadata:
  runtime: onnxruntime
  model_family: qwen3
  task: chat-completion
  precision: int4
  source: Qwen/Qwen3-4B-Instruct-2507
  huggingface_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  # KV cache capacity in tokens, allocated once on load (~144 KB/token).
  max_context: 8192
