id: voice-cascade
name: Realtime voice cascade (Silero VAD, SenseVoice, Qwen3 chat, Qwen3-TTS)
enabled: true
task_kinds:
  - voice.realtime
adapter: voice_cascade
backend: ort
artifacts:
  # Silero VAD v6.2.3 (tag commit); the conversation's other models are
  # named below.
  - type: url
    url: https://github.com/snakers4/silero-vad/raw/5cd7945676eb32225748052e2e6a0580e4686a08/src/silero_vad/data/silero_vad.onnx
    sha256: 1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3
runtime:
  # The VAD always runs on CPU (one small session per conversation); the
  # named models keep their own provider order.
  provider_order: [cuda, cpu]
  max_concurrency: 1
  idle_ttl_sec: 600
resources:
  min_ram_mb: 256
  min_vram_mb: 0
load_policy:
  lazy: true
  evictable: true
  pin: false
metadata:
  runtime: onnxruntime
  task: realtime-voice
  chat_model: qwen3-4b-instruct-2507-int4-onnx
  # The low-latency float16 SenseVoice (~40-90 ms per utterance on CUDA;
  # sensevoice-small-onnx, int8: ~200-350 ms).
  asr_model: sensevoice-small-fp16-onnx
  # Used instead when asr_model cannot load (not exported here).
  asr_fallback_model: sensevoice-small-onnx
  # Qwen3-TTS streams: a clause starts playing ~50 ms after it is asked
  # for. IndexTTS (indextts-1.5-onnx, indextts-2.5-onnx) speaks clause by
  # clause.
  tts_model: qwen3-tts-0.6b-onnx
  # A WAV path the worker reads, used when a session sends no ref_audio.
  default_reference_audio: ""
  # What default_reference_audio says: Qwen3-TTS then clones the voice in
  # context (closer) rather than from its x-vector alone.
  default_reference_text: ""
  # The language Qwen3-TTS speaks (chinese, english, ...; empty: it decides).
  tts_language: chinese
  # Speak a reply's first clause while the chat model is still writing it
  # (only with a TTS model that takes streamed text, Qwen3-TTS).
  tts_stream_text: true
  # The emotion the bot speaks with (IndexTTS-2.5; 1.5 ignores it): happy,
  # angry, sad, afraid, disgusted, melancholic, surprised, calm, or none for
  # the reference voice's own. Strength 0 to 1; the reference makes up the
  # rest.
  tts_emotion: calm
  tts_emotion_strength: 0.8
  # The wake word spotter's model, beside the VAD model (group sessions):
  # python -m scripts.local.fetch_kws_model. Missing: the bot's name in the
  # transcript calls it.
  kws_dir: kws
  # The spotter: mean token probability a wake word needs (and one of four
  # tokens or fewer, like "M3"), and the paths its search keeps. Unset: the
  # adapter's (0.20, 0.20, 16).
  # kws_threshold: 0.2
  # kws_short_threshold: 0.2
  # kws_paths: 16
  # Calls the transcript heard and the spotter missed: the newest this many
  # kept (audio and text) in <data>/voice-cascade-missed-wakes; 0 for none.
  # missed_wakes_kept: 200
